name: Daily Roadmap

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          fetch-depth: 0
          # With a fine-grained PAT in ROADMAP_PUSH_TOKEN (contents+PRs write),
          # the branch push triggers CI so the PR's required check runs without
          # a manual nudge. Falls back to github.token (recursion-guarded).
          token: ${{ secrets.ROADMAP_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # releases/v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: tests
        continue-on-error: true
        run: npx vitest run
      - id: build
        continue-on-error: true
        run: npm run build
      - name: Generate roadmap page
        env:
          GH_TOKEN: ${{ github.token }}
          ROADMAP_FETCH_GITHUB: "1"
          ROADMAP_TEST_STATUS: ${{ steps.tests.outcome }}
          ROADMAP_BUILD_STATUS: ${{ steps.build.outcome }}
        run: npm run roadmap
      - name: Open or update roadmap PR
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
        run: |
          if git diff --quiet -- public/roadmap.html; then
            echo "Roadmap page is already current."
            exit 0
          fi

          branch="automation/daily-roadmap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/roadmap.html
          # No heredocs in this script: a col-0 terminator dedents out of the
          # YAML literal block and breaks the whole workflow file's parsing.
          git commit \
            -m "Refresh the public roadmap snapshot" \
            -m "Daily automation refreshes the roadmap page from repository source, tests, build status, and git history. Main is protected, so automation publishes through a PR branch." \
            -m "Tested: vitest outcome: ${TEST_STATUS}; build outcome: ${BUILD_STATUS}"
          git push --force-with-lease origin "$branch"

          {
            printf '%s\n\n' "Daily roadmap refresh."
            printf '%s\n' "- Tests: ${TEST_STATUS}" "- Build: ${BUILD_STATUS}" "- Generated page: \`public/roadmap.html\`"
            printf '\n%s\n' "This PR is opened by the scheduled roadmap workflow instead of committing directly to protected \`main\`."
          } > /tmp/roadmap-pr-body.md

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --body-file /tmp/roadmap-pr-body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Refresh daily roadmap status" --body-file /tmp/roadmap-pr-body.md
          fi
      - name: Fail if verification failed
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "Roadmap was generated, but verification failed."
          exit 1
