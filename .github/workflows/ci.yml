name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The constitution: economy invariants, health triage, tutorial integrity
      - run: npx vitest run
      # Type-check + production build
      - run: npm run build
